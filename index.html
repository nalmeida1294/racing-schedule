<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Racing Schedule</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>
        <h1>🏁 Racing Schedule</h1>
        <p>Upcoming races across every series</p>
    </header>


<main>

    <div id="app">

        <div id="home-view">

            <div id="schedule">
                <p>Loading racing schedule...</p>
            </div>

        </div>


        <div id="series-view" style="display: none;">

            <button id="back-button">
                ← Back to All Series
            </button>

            <div id="series-calendar"></div>

        </div>

    </div>

</main>


    <script src="script.js"></script>

</body>
</html>
