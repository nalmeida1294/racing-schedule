<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Race Control</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>


<body>

<header>

    <div class="header-content">

        <div class="header-title">

            <div class="race-mark" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
            </div>

            <div>
                <p class="header-kicker">THE PADDOCK</p>
                <h1>Race <em>Control</em></h1>
                <p class="header-subtitle">Your racing weekend, in one place.</p>
            </div>

        </div>


        <button id="customize-button">

            <span class="customize-icon">
                ⚙
            </span>

            <span>
                Customize Series
            </span>

        </button>

    </div>

</header>


    <main>

        <div id="app">


            <!-- HOME VIEW -->

            <div id="home-view">

                <section id="weekend-section" aria-labelledby="weekend-heading">

                    <div class="weekend-heading-row">
                        <div>
                            <p class="weekend-eyebrow">UPCOMING RACE WINDOW</p>
                            <h2 id="weekend-heading">Races this weekend</h2>
                        </div>
                        <p id="weekend-date-range" class="weekend-date-range"></p>
                    </div>

                    <div id="weekend-races"></div>

                </section>

                <div id="schedule">

                    <p>
                        Loading racing schedule...
                    </p>

                </div>

            </div>


            <!-- SERIES VIEW -->

            <div
                id="series-view"
                style="display: none;"
            >

                <button id="back-button">
                    ← Back to All Series
                </button>

                <div id="series-calendar"></div>

            </div>


            <div
                id="event-view"
                style="display: none;"
            >

                <button id="event-back-button">
                    ← Back to Series Schedule
                </button>

                <div id="event-details"></div>

            </div>


        </div>

    </main>


    <!-- CUSTOMIZE SERIES PANEL -->

    <div
        id="customize-overlay"
        class="customize-overlay"
    >

        <div class="customize-panel">


            <div class="customize-header">

                <div>

                    <h2>
                        Customize Series
                    </h2>

                    <p>
                        Drag series to change their order.
                        Hide any series you don't want to see.
                    </p>

                </div>


                <button
                    id="close-customize"
                    class="close-customize"
                >
                    ×
                </button>

            </div>


            <div id="customize-series-list"></div>


            <div class="customize-footer">

                <button id="reset-series">
                    Reset to Default
                </button>

            </div>


        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
